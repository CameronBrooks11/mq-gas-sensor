name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # Pinned: simavr comes from this release's apt archive.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.40.0"

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.1"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"

      - name: Setup (board cores and libraries)
        run: just setup

      - name: Check (assets, coefficients page, compile every example)
        run: just check

      - name: Install simavr
        run: sudo apt-get update && sudo apt-get install -y simavr

      - name: Test (library on a simulated Mega 2560, scripts, curve tracer)
        run: just test

  # The Arduino Library Manager's checks, with the rules for a new submission.
  # Switch library-manager to "update" once the library is in its index.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: arduino-lint
        uses: arduino/arduino-lint-action@v3
        with:
          library-manager: submit
          compliance: strict

  # The library as PlatformIO resolves it from library.json, on one board of
  # each architecture library.properties declares, each with the example
  # written for it (the pairs scripts/examples.sh uses).
  platformio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: AVR (Uno), examples/MQ-2
        run: pio ci --lib=. --board=uno examples/MQ-2/MQ-2.ino

      - name: ESP32, examples/ESP32
        run: pio ci --lib=. --board=esp32dev examples/ESP32/ESP32.ino

      - name: ESP8266, examples/ESP8266
        run: pio ci --lib=. --board=nodemcuv2 examples/ESP8266/ESP8266.ino
