name: Docs site

# Builds the MkDocs site from docs/ and publishes it to GitHub Pages from main.
# A pull request builds it only, so a broken link, an API page out of step with
# the header, or an undescribed example fails before it can deploy. Every pull
# request builds it, since the pages are checked against src/ and examples/.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.40.0"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"

      - name: Build the site
        run: just docs

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
