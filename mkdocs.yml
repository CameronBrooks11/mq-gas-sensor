site_name: MQGasSensor
site_description: Arduino library for MQ-series gas sensors, with every calibration coefficient traced to its datasheet
site_url: https://cameronbrooks11.github.io/mq-gas-sensor/
repo_url: https://github.com/CameronBrooks11/mq-gas-sensor
repo_name: CameronBrooks11/mq-gas-sensor
edit_uri: edit/main/docs/
copyright: MIT

# docs/README.md indexes the folder for readers on GitHub; the site has its own.
exclude_docs: |
  README.md

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - API: api.md
  - Sensors: sensors.md
  - Examples: examples.md
  - Migrating from 1.x: migration.md
  - Coefficients:
      - Calibration coefficients: coefficients.md
      - Methods: methods.md
      - Datasheets: datasheets.md
      - Curve tracing: curve-tracing.md
  - Development: development.md

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - content.code.copy
    - navigation.footer
    - navigation.top
    - search.highlight
    - toc.follow

hooks:
  - scripts/mkdocs_hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
